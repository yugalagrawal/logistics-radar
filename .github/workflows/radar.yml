name: Logistics Radar

on:
  schedule:
    - cron: "30 2 * * *"   # daily  08:00 IST  (weekly digest is switched off)
  workflow_dispatch:
    inputs:
      mode:
        description: Which digest to run
        type: choice
        options: [daily, weekly, test-send, rescore]
        default: daily
      preview:
        description: Preview - send only to my chat, don't mark stories as sent
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RADAR_CONFIG: ${{ secrets.RADAR_CONFIG }}
        run: |
          MODE=daily
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            if [ "${{ inputs.preview }}" = "true" ]; then EXTRA="--preview"; fi
          fi
          echo "Running mode: $MODE $EXTRA"
          python radar.py "$MODE" $EXTRA

      - name: Save state (seen items + weekly history)
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Update radar state"
            git push
          fi
