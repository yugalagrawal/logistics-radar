# Headlines matching any of these (regex, case-insensitive) are dropped before scoring:
# market-research press releases and stock-price chatter.
exclude_patterns:
  - '\bmarket (size|share|report|forecast|research|outlook|to 20\d\d)'
  - '\bforecast (to|till|through) 20\d\d'
  - '\bCAGR\b'
  - '\b(share|stock) price\b'
  - '\bshares? (rise|rises|fall|falls|jump|jumps|surge|surges|slump|slumps|gain|gains|drop|drops|tank|rally)'
  - '\bis rated (buy|sell|hold)\b'
  - '\b(open interest|target price|buy rating|sell rating|technical strength|stock to watch|stocks to buy)\b'
  - '\((NSE|BSE|NASDAQ|NYSE)[: ]'
  - '(?-i:\b[A-Z]{2,5} [Ss]tock\b)'

# Used by `filter: true` feeds (case-insensitive substring match on title + summary).
keywords:
  - logistic
  - freight
  - truck
  - fleet
  - cargo
  - supply chain
  - warehous
  - 3pl
  - ptl
  - ftl
  - ltl
