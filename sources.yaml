# Logistics Radar configuration. Edit freely — no code changes needed.

# Who you are. The LLM uses this to decide what is "important" for you.
profile: |
  I am a Product Manager at a B2B trucking and logistics company: intra-city and
  inter-city freight, FTL and PTL, contract fleets for enterprises, plus fleet and
  driver-partner operations.

  IN SCOPE: B2B trucking, FTL/PTL/LTL, road freight, freight marketplaces,
  contract logistics / 3PL, fleet management, driver-partner platforms, EV cargo
  fleets, freight tech (TMS, telematics, route optimisation), trucking VAS
  (freight finance, fuel, insurance, FASTag) and road-freight policy.

  OUT OF SCOPE (score 1-3): B2C and quick-commerce consumer features, ride-hailing,
  stock-price articles, generic market-research press releases, air/sea/port news
  with no road-freight angle, passenger EVs and two-wheelers.

  I care MOST about new business models, value-added services, product launches
  and innovation in my space, in India or globally.

settings:
  timezone: Asia/Kolkata
  lookback_hours: 36          # ignore articles older than this
  max_items_per_run: 200      # cap on items sent to the LLM per run (protects free quota)
  batch_size: 20              # items per LLM request
  keep_days: 30               # how long scored items are stored for the weekly digest
  empty_daily_message: "No news today bro 😎"

  # Each subsection shows every must-read item (up to max), and is topped up
  # to `min` with the next-best items even if they score lower.
  daily:
    must_read_score: 8
    filler_min_score: 5       # never show items scored below this (keeps out-of-scope news out)
    sections:
      innovation: {min: 5, max: 5}   # 💡 Innovation Radar
      supply:     {min: 2, max: 3}   # 🎯 Growth Playbook · 🚛 Supply
      demand:     {min: 2, max: 3}   # 🎯 Growth Playbook · 🤝 Demand
      ptl:        {min: 2, max: 3}   # 🎯 Growth Playbook · 📦 PTL / LTL
      india:      {min: 3, max: 5}   # 📰 Market Pulse · 🇮🇳 India
      global:     {min: 2, max: 3}   # 📰 Market Pulse · 🌍 Global
  # Weekly digest is off (removed from the schedule); still runnable manually as `weekly`.
  weekly:
    must_read_score: 7
    filler_min_score: 6
    sections:
      innovation: {min: 5, max: 8}
      supply:     {min: 2, max: 4}
      demand:     {min: 2, max: 4}
      ptl:        {min: 2, max: 4}
      india:      {min: 3, max: 7}
      global:     {min: 2, max: 5}

# Example growth goals -> the GROWTH PLAYBOOK section. The AI tags each story with
# the goal it informs. Replace these with your own.
growth_goals:
  supply:
    label: "🚛 Supply"
    subtitle: "Partners, truckers, fleet owners"
    meaning: >
      Growing and retaining the supply side: truck owners, drivers, fleet partners,
      vehicle financing, driver earnings, incentives and onboarding.
  demand:
    label: "🤝 Demand"
    subtitle: "Clients, market share, opportunities"
    meaning: >
      Winning more shippers: sectors where B2B freight demand is opening up, SMEs,
      new hubs, government schemes, and new ways to sell.
  ptl:
    label: "📦 PTL / LTL"
    subtitle: "Part-load"
    meaning: >
      News about PTL / LTL / B2B express cargo players: network, hubs, pricing,
      launches, tech, and gaps to exploit.

# Categories the LLM picks from (shown as a tag on each item).
categories:
  - Competitor
  - Funding & M&A
  - Customer & Market
  - Policy & Regulation
  - EV & Fleet
  - Product & VAS
  - Tech & Automation
  - Patent & R&D
  - Other

